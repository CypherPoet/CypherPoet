<svg xmlns="http://www.w3.org/2000/svg" width="800" height="12" viewBox="0 0 800 12">
  <style>
    @keyframes waveMove {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    .wave-group { animation: waveMove 8s linear infinite; }
    @keyframes colorShift {
      0% { stop-color: #58a6ff; }
      33% { stop-color: #bc8cff; }
      66% { stop-color: #f778ba; }
      100% { stop-color: #58a6ff; }
    }
    @keyframes colorShift2 {
      0% { stop-color: #bc8cff; }
      33% { stop-color: #f778ba; }
      66% { stop-color: #58a6ff; }
      100% { stop-color: #bc8cff; }
    }
    #ws1 { animation: colorShift 6s ease infinite; }
    #ws2 { animation: colorShift2 6s ease infinite; }
  </style>
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop id="ws1" offset="0%" stop-color="#58a6ff"/>
      <stop id="ws2" offset="100%" stop-color="#bc8cff"/>
    </linearGradient>
  </defs>
  <clipPath id="clip"><rect width="800" height="12"/></clipPath>
  <g clip-path="url(#clip)">
    <g class="wave-group">
      <path d="M0,6 Q50,0 100,6 Q150,12 200,6 Q250,0 300,6 Q350,12 400,6 Q450,0 500,6 Q550,12 600,6 Q650,0 700,6 Q750,12 800,6 Q850,0 900,6 Q950,12 1000,6 Q1050,0 1100,6 Q1150,12 1200,6" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
