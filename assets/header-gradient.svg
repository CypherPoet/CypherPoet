  <style>
    @keyframes gradientShift {
      0% { stop-color: #58a6ff; }
      25% { stop-color: #bc8cff; }
      50% { stop-color: #f778ba; }
      75% { stop-color: #ff9a3c; }
      100% { stop-color: #58a6ff; }
    }
    @keyframes gradientShift2 {
      0% { stop-color: #bc8cff; }
      25% { stop-color: #f778ba; }
      50% { stop-color: #ff9a3c; }
      75% { stop-color: #58a6ff; }
      100% { stop-color: #bc8cff; }
    }
    @keyframes fadeFloat {
      0%, 100% { opacity: 0.08; transform: translateY(0); }
      50% { opacity: 0.15; transform: translateY(-4px); }
    }
    #grad-stop1 { animation: gradientShift 8s ease infinite; }
    #grad-stop2 { animation: gradientShift2 8s ease infinite; }
    .logo-shape { animation: fadeFloat 6s ease-in-out infinite; }
  </style>
